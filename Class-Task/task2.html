<!-- Task 2 Tooltip Demo 
Create tooltips with CSS only using position: absolute + opacity transition.
Smooth fade-in (transition: 0.3s ease-in-out).
Centered layout with Flexbox. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <style>
body {
  font-family: 'Poppins', sans-serif;
  background: #fdeaf8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 50vh;
  margin: 0;
}

h1 {
  margin-bottom: 10rem;
  color: #2d3436;
  font-size: 72px;
}

/* Centered Flex container for tooltips */
.tooltip-container {
  display: flex;
  gap: 2rem;
  justify-content: center;
  align-items: center;
}

/* Tooltip wrapper */
.tooltip {
  position: relative;
  background: yellow;
  color: black;
  padding: 0.8rem 1.2rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.3s;
  border: 2px solid #000;
}

.tooltip:hover {
  background: #2b00ff;
  color: white;
  border: 3px solid #ff0000;
}

/* Tooltip text */
.tooltip-text {
  visibility: hidden;
  opacity: 0;
  width: max-content;
  background-color: #2d3436;
  color: #fff;
  text-align: center;
  padding: 0.5rem 0.8rem;
  border-radius: 6px;
  position: absolute;
  bottom: 125%; 
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
  pointer-events: none; 
  white-space: nowrap;
}

/* Tooltip arrow */
.tooltip-text::after {
  content: "";
  position: absolute;
  top: 100%; 
  left: 50%;
  margin-left: -5px;
  border-width: 5px;
  border-style: solid;
  border-color: #2d3436 transparent transparent transparent;
}

/* Show tooltip on hover */
.tooltip:hover .tooltip-text {
  visibility: visible;
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
  </style>
</head>
<body>
  <h1>Tooltip Demo</h1>
    <!-- Tooltip Example -->
    <div class="tooltip">
      Hover me.
      <span class="tooltip-text">Center-aligned tooltip here!</span>
    </div>
  </div>
</body>
</html>
