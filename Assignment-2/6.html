<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockquote and cite</title>
</head>
<body>
    <!-- Use the <blockquote> tag to display a meaningful quote and mention the author’s name
using <cite>. -->
    <blockquote>
        "The only way to do great work is to love what you do." - <cite>Steve Jobs</cite>
    </blockquote>
</body>
</html>
