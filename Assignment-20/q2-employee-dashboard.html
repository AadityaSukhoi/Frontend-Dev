<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Status Dashboard</title>
    <script src="q2-employee-dashboard.js" defer></script>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f6fa;
            padding: 40px;
        }
        h1 { text-align: center; margin-bottom: 20px; }
        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 15px;
            text-align: center;
        }
        .active { color: green; font-weight: bold; }
        .inactive { color: red; font-weight: bold; }
        button {
            padding: 8px 14px;
            border: none;
            background: #4a7dff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #325fe0; }
        #error {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

<h1>Employee Status Dashboard</h1>

<table id="empTable">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Toggle</th>
    </tr>
</table>

<p id="error">Failed to update employee status!</p>

</body>
</html>
