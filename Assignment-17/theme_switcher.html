<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q4 - Theme Switcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .theme-light {
      background-color: #ffffff;
      color: #000000;
    }

    .theme-dark {
      background-color: #222222;
      color: #ffffff;
    }

    .theme-blue {
      background-color: #1e3a8a;
      color: #e0f2fe;
    }

    button {
      margin-right: 10px;
      padding: 6px 12px;
      cursor: pointer;
    }

    #currentTheme {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body class="theme-light" data-theme="light">
  <h1>Theme Switcher</h1>

  <button data-theme-btn="light">Light</button>
  <button data-theme-btn="dark">Dark</button>
  <button data-theme-btn="blue">Blue</button>

  <div id="currentTheme">Current theme: light</div>

  <script src="theme_switcher.js"></script>
</body>
</html>
