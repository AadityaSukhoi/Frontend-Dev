<!-- Design a Complete Mini User Interface Layout
Requirements:
● Build a compact webpage containing a header, a main content
card, and a footer.
● Inside the main card, include a form, buttons, and a small image.
● Apply consistent box-sizing, shadows, and border styles.
● Add hover and focus effects using pseudo-classes.
● Use Flexbox for layout alignment and ensure full responsiveness. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface Layout</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #f8fafc);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header, footer {
    background: #2563eb;
    color: white;
    text-align: center;
    padding: 1rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }

  .card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
  }

  .card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #2563eb;
    box-shadow: 0 4px 10px rgba(37,99,235,0.3);
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  input[type="text"],
  input[type="email"] {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    transition: all 0.25s ease;
    font-size: 1rem;
  }

  input[type="text"]:focus,
  input[type="email"]:focus {
    border-color: #2563eb;
    outline: none;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
  }

  .btn-group {
    display: flex;
    justify-content: space-between;
    gap: 0.8rem;
  }

  button {
    flex: 1;
    padding: 0.75rem;
    border-radius: 8px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .btn-primary {
    background: #2563eb;
    color: white;
  }
  .btn-primary:hover {
    background: #1d4ed8;
    transform: scale(1.03);
  }
  .btn-primary:active {
    transform: scale(0.96);
  }

  .btn-secondary {
    background: #10b981;
    color: white;
  }
  .btn-secondary:hover {
    background: #059669;
    transform: scale(1.03);
  }
  .btn-secondary:active {
    transform: scale(0.96);
  }

  @media (max-width: 600px) {
    .card {
      width: 90%;
      padding: 1.5rem;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>Mini User Interface Layout</h1>
  </header>

  <main>
    <div class="card">
      <img src="https://picsum.photos/100" alt="User Image">
      <form>
        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter your email">
        <div class="btn-group">
          <button type="submit" class="btn-primary">Submit</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
