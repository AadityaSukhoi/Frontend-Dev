<!-- Design a form that collects student information — Name, Roll Number, and Course.
Use a <select> dropdown for choosing a course.
Include an option that says “Select Course” as default (disabled and selected). -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
</head>
<body>
    <h1>Student Information</h1>
    <form action="#" method="post">

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" name="roll" placeholder="Enter your roll number" required><br><br>

        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <option value="" disabled selected>Select Course</option>
            <option value="BTech">B.Tech</option>
            <option value="MTech">M.Tech</option>
            <option value="BSc">B.Sc</option>
            <option value="MSc">M.Sc</option>
        </select><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
