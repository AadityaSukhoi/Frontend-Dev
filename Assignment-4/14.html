<!-- Use an <iframe> to embed an external website (e.g., https://www.wikipedia.org).
Below it, write a paragraph saying:
“Some websites may not allow embedding for security reasons.” -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Example</title>
</head>
<body>
    <h1>Embedding an External Website</h1>

    <iframe src="https://www.wikipedia.org" width="800" height="600" title="Wikipedia Website"></iframe>

    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
