<!-- Create a CSS Animation Demonstration Page
Requirements:
● Build at least three animated elements (e.g., moving box, bouncing
ball, or color-changing text).
● Use @keyframes to define animations.
● Apply properties like animation-delay, animation-iteration-count,
and animation-direction.
● Center animations vertically and horizontally on the page.

● Ensure smooth transitions and clean timing using ease-in-out. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demonstration</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    gap: 3rem;
  }

  /* 1️⃣ Moving Box Animation */
  .moving-box {
    width: 80px;
    height: 80px;
    background: #2563eb;
    border-radius: 10px;
    animation: moveBox 3s ease-in-out infinite alternate;
  }

  @keyframes moveBox {
    0% {
      transform: translateX(-100px);
      background: #2563eb;
    }
    50% {
      background: #3b82f6;
    }
    100% {
      transform: translateX(100px);
      background: #1e40af;
    }
  }

  /* 2️⃣ Bouncing Ball Animation */
  .bouncing-ball {
    width: 60px;
    height: 60px;
    background: #10b981;
    border-radius: 50%;
    animation: bounce 1.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-120px);
    }
  }

  .color-text {
    font-size: 2rem;
    font-weight: 700;
    animation: colorShift 4s ease-in-out infinite alternate;
  }

  @keyframes colorShift {
    0% {
      color: #ef4444;
    }
    25% {
      color: #f59e0b;
    }
    50% {
      color: #10b981;
    }
    75% {
      color: #3b82f6;
    }
    100% {
      color: #8b5cf6;
    }
  }

  .moving-box {
    animation-delay: 0.5s;
  }

  .bouncing-ball {
    animation-delay: 1s;
    animation-iteration-count: infinite;
  }

  .color-text {
    animation-direction: alternate-reverse;
  }
</style>
</head>
<body>
  <div class="moving-box"></div>
  <div class="bouncing-ball"></div>
  <div class="color-text">Color Changing Text</div>
</body>
</html>
