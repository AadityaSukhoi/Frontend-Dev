<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Inline Formatting</title>

<body>
    <!-- Create a creative paragraph combining multiple inline elements (<strong>, <em>,
<mark>, <small>, <br>) to demonstrate inline formatting. -->
