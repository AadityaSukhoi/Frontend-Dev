<!-- Create an HTML file with two iframes displayed one below another:
● The first iframe should display your introduction page.
● The second iframe should display your favorite hobby page.
Use width and height attributes to make them look balanced. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes Example</title>
</head>
<body>
    <iframe src="introduction.html" width="100%" height="50%"></iframe>
    <iframe src="hobby.html" width="100%" height="50%"></iframe>
</body>
</html>
