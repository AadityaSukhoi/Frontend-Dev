<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>span tag</title>
</head>
<body>
    <!-- Write a paragraph that contains three <span> elements — use them to highlight or label
different parts of the text (you can imagine colors or meanings). -->
    <p>This is a <span style="color: red;">red</span> apple, a <span style="color: green;">green</span> leaf, and a <span style="color: blue;">blue</span> sky.</p>
</body>
</html>
