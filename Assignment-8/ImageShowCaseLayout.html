<!-- Create an Image Showcase Layout
Requirements:

● Display six images arranged using Grid or Flexbox.
● On hover, each image should slightly scale up (transform:
scale(1.1)) and darken using a semi-transparent overlay.
● Add rounded corners and box-shadow to make images modern.
● Include short captions below each image using <figcaption>.
● Make the layout responsive and stack images in one column below
700px. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Showcase Layout</title>
<style>
  /* ===== Global Reset ===== */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  :root {
    --bg: #f8fafc;
    --caption-color: #334155;
    --shadow: 0 6px 18px rgba(0,0,0,0.1);
    --radius: 12px;
    --duration: 0.35s;
    font-family: "Inter", system-ui, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 2rem;
    color: #1e293b;
  }

  /* ===== Grid Layout ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    width: 100%;
    max-width: 1100px;
  }

  figure {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin: 0;
    background: #000; /* fallback for dark overlay */
  }

  figure img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform var(--duration) ease, opacity var(--duration) ease;
  }

  /* Overlay effect */
  figure::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    transition: background var(--duration) ease;
    z-index: 1;
  }

  /* Hover state */
  figure:hover img {
    transform: scale(1.1);
  }

  figure:hover::before {
    background: rgba(0, 0, 0, 0.35);
  }

  /* Caption */
  figcaption {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0.75rem;
    background: #fff;
    color: var(--caption-color);
    font-weight: 500;
    font-size: 0.95rem;
    border-bottom-left-radius: var(--radius);
    border-bottom-right-radius: var(--radius);
  }

  /* ===== Responsive Stack ===== */
  @media (max-width: 700px) {
    .gallery {
      grid-template-columns: 1fr;
    }
  }

  /* Subtle entrance animation */
  figure {
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.6s ease forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <h1>Image Showcase Layout</h1>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain Lake">
      <figcaption>Peaceful Mountain Lake</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1025/600/400" alt="Dog Portrait">
      <figcaption>Gentle Dog Portrait</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1040/600/400" alt="City Skyline">
      <figcaption>Evening City Skyline</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1062/600/400" alt="Forest Path">
      <figcaption>Chill Doggo</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1074/600/400" alt="Desert Dunes">
      <figcaption>Big Cats</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1084/600/400" alt="Ocean Waves">
      <figcaption>Walrus</figcaption>
    </figure>
  </div>
</body>
</html>
