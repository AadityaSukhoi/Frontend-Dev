<!-- 2. Personal Portfolio Basics (Bootstrap Utilities)
Scenario:
Design your personal profile homepage using Bootstrap’s basic utilities.
Requirements:
● Use margin (mt-4, mb-3), padding (p-5), text (text-center, fw-bold), and
background (bg-light, text-dark) classes.
● Include:
○ A header with your name and tagline.
○ A profile image (.img-fluid, .rounded-circle).
○ Two buttons: “Hire Me” and “Download CV”.
○ A small contact form using .form-control.
● Use .container and .text-center for alignment.

Goal: Apply Bootstrap basics like spacing, text, background, buttons, and inputs in a real
portfolio layout. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="container text-center mt-4">
        <h1 class="fw-bold">Aaditya Ranjan Moitra</h1>
        <p class="mb-3">Aspiring AI & Analytics Engineer • Code Sorcerer in Training</p>
    </header>

    <!-- Profile Section -->
    <section class="container text-center p-5">

        <!-- Profile Image -->
        <img src="images/Happy-Intern-2.jpg" class="rounded-circle hero-image border border-white border-5 mb-4 shadow w-25" alt="Profile Photo">

        <!-- Buttons -->
        <div class="mt-3">
            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-outline-dark">Download CV</button>
        </div>

    </section>

    <!-- Contact Form -->
    <section class="container p-5">
        <h3 class="text-center fw-bold mb-3">Contact Me</h3>

        <form class="mx-auto" style="max-width: 500px;">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>
            <button class="btn btn-success w-100">Send Message</button>
        </form>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
