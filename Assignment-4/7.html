<!-- Build a Login Form with fields for username and password.
Add a hidden input field with a dummy CSRF token value.
Write an HTML comment explaining the purpose of a CSRF token. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form action="#" method="post">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Hidden CSRF token -->
        <!-- A CSRF (Cross-Site Request Forgery) token helps prevent malicious attacks by ensuring that the form submission comes from a legitimate source. -->
        <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">

        <input type="submit" value="Login">
    </form>
</body>
</html>
