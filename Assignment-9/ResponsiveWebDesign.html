<!-- Q2. Responsive Web Design Layout
Goal:
Build a simple homepage layout that adapts to screen size using Flexbox.
Requirements:
● Header with logo on the left and navigation links on the right.
● Main area contains three feature boxes arranged horizontally.
● Footer is centered at the bottom of the page.
● Below 750 px, the feature boxes should stack vertically.
● On hover, each box should slightly scale up with a transition effect. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design Layout</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header class="header">
        <div class="logo">🌐 MyLogo</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="main">
        <div class="feature-box">
            <h2>Feature One</h2>
        </div>
        <div class="feature-box">
            <h2>Feature Two</h2>
        </div>
        <div class="feature-box">
            <h2>Feature Three</h2>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 MyWebsite | All Rights Reserved</p>
    </footer>
</body>
</html>
