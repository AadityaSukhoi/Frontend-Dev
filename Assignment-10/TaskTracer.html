<!-- 7. Task Tracker with Badges
Scenario:
Design a task manager interface showing tasks with completion status.
Requirements:
● Display tasks in a .list-group.
● Each task includes a badge indicating priority (High, Medium, Low).
● Add a badge counter in the header showing total pending tasks.
● Include a “Completed” button with .btn and embedded badge.

Goal: Practice badges and contextual color usage for real data indicators. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Task Tracker</h2>
            <span class="badge bg-primary fs-6">5 Pending</span>
        </div>

        <ul class="list-group mb-4">

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Finish Bootstrap Assignment
                <span class="badge bg-danger">High</span>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center">
                Prepare AI Lab Notes
                <span class="badge bg-warning text-dark">Medium</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Update Portfolio Website
                <span class="badge bg-success">Low</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Practice DSA Problems
                <span class="badge bg-danger">High</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Respond to Emails
                <span class="badge bg-success">Low</span>
            </li>

        </ul>

        <button class="btn btn-success">
            Completed <span class="badge bg-light text-dark ms-1">3</span>
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
