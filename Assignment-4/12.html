<!-- Create a paragraph that uses HTML entities to display:
● <, >, &, ", and '
Also include ©, TM, and ® symbols using entities. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities Example</title>
</head>
<body>
    <h1>HTML Entities Demo</h1>
    <p>
        Special characters: &lt;, &gt;, &amp;, &quot;, &apos;<br>
        Symbols: &copy;, &trade;, &reg;
    </p>
</body>
</html>
