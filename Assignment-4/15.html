<!-- Create a Payment Form with fields for:
● Cardholder Name
● Card Number
● Expiry Date
● CVV
Add the required attribute to all fields and include a “Pay Now” button. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <h1>Payment Form</h1>
    <form action="#" method="post">

        <label for="cardholder">Cardholder Name:</label><br>
        <input type="text" id="cardholder" name="cardholder" placeholder="Enter cardholder name" required><br><br>

        <label for="cardnumber">Card Number:</label><br>
        <input type="text" id="cardnumber" name="cardnumber" placeholder="Enter card number" required pattern="\d{13,19}" title="Enter 13 to 19 digit card number"><br><br>

        <label for="expiry">Expiry Date:</label><br>
        <input type="month" id="expiry" name="expiry" required><br><br>

        <label for="cvv">CVV:</label><br>
        <input type="text" id="cvv" name="cvv" placeholder="Enter CVV" required pattern="\d{3,4}" title="Enter 3 or 4 digit CVV"><br><br>

        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
