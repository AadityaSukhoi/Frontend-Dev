<!-- Task 10 Mini User Interface Layout Header + main card + footer structure. Inside main: form + buttons + image. Consistent box-sizing, shadows, borders. Add hover/focus pseudo-classes. Fully responsive with Flexbox. -->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini UI Layout</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  :root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --border: #e3e8ee;
    --accent: #2563eb;
    --accent-light: #3b82f6;
    --shadow: 0 6px 18px rgba(0,0,0,0.06);
    --radius: 10px;
    --duration: 220ms;
    --ease: cubic-bezier(.25,.8,.25,1);
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: #1e293b;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* === Header === */
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    margin: 0;
    font-size: 1.2rem;
  }

  header nav a {
    text-decoration: none;
    color: #475569;
    margin-left: 1.25rem;
    font-weight: 500;
    transition: color var(--duration) var(--ease);
  }

  header nav a:hover,
  header nav a:focus-visible {
    color: var(--accent);
  }

  /* === Main section === */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-wrap: wrap;
    max-width: 900px;
    width: 100%;
    overflow: hidden;
  }


  .card-content {
    flex: 1 1 350px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card-content h2 {
    margin-top: 0;
    margin-bottom: 1rem;
    font-size: 1.3rem;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  input[type="text"],
  input[type="email"] {
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 1rem;
    transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
  }

  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
  }

  .buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  button {
    padding: 0.75rem 1.25rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--duration) var(--ease), transform var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
  }

  button:hover,
  button:focus-visible {
    background: var(--accent-light);
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(37,99,235,0.25);
  }

  button:active {
    transform: translateY(0);
    box-shadow: none;
  }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-secondary:hover,
  .btn-secondary:focus-visible {
    background: var(--accent);
    color: white;
  }

  /* === Responsive tweaks === */
  @media (max-width: 700px) {
    header {
      flex-direction: column;
      gap: 0.5rem;
    }
    .card {
      flex-direction: column;
    }
    .card-content {
      padding: 1.5rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>Mini UI Layout</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="card-content">
        <h2>Join the Newsletter</h2>
        <form action="#">
          <input type="text" placeholder="Full name" required>
          <input type="email" placeholder="Email address" required>
          <div class="buttons">
            <button type="submit">Subscribe</button>
            <button type="reset" class="btn-secondary">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
