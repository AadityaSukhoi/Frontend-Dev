<!-- 8. Pricing Plans (Panels & Cards)
Scenario:
Create a “Choose Your Plan” pricing section for a SaaS product.
Requirements:
● Use 3 Bootstrap cards side-by-side (col-md-4).
● Each card contains plan name, price, and features list.
● Highlight the “Pro” plan using a different color (bg-primary, text-white).
● Add hover effects using .shadow-lg and CSS transitions.

Goal: Build a responsive, card-based layout similar to pricing sections on real websites. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .price-card {
            transition: 0.3s ease;
        }
        .price-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center fw-bold mb-5">Choose Your Plan</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card price-card shadow-sm">
                    <div class="card-body text-center">
                        <h4 class="fw-bold">Basic</h4>
                        <h2 class="my-3">$9<span class="fs-6">/mo</span></h2>
                        <ul class="list-unstyled mb-4">
                            <li>✔ 5 Projects</li>
                            <li>✔ Email Support</li>
                            <li>✔ Basic Analytics</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100">Choose Basic</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-primary text-white price-card shadow-lg">
                    <div class="card-body text-center">
                        <h4 class="fw-bold">Pro</h4>
                        <h2 class="my-3">$29<span class="fs-6 text-light">/mo</span></h2>
                        <ul class="list-unstyled mb-4">
                            <li>✔ Unlimited Projects</li>
                            <li>✔ Priority Support</li>
                            <li>✔ Advanced Analytics</li>
                        </ul>
                        <button class="btn btn-light w-100 fw-bold">Choose Pro</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4"
                <div class="card price-card shadow-sm">
                    <div class="card-body text-center">
                        <h4 class="fw-bold">Enterprise</h4>
                        <h2 class="my-3">$59<span class="fs-6">/mo</span></h2>
                        <ul class="list-unstyled mb-4">
                            <li>✔ Team Management</li>
                            <li>✔ Dedicated Manager</li>
                            <li>✔ Full Data Access</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100">Choose Enterprise</button>
                    </div>
                </div>
            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
