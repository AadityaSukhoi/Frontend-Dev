<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3x2 Image Grid</title>

  <style>
    :root {
      --gap: 18px;
      --radius: 12px;
      --shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      --overlay: rgba(0, 0, 0, 0.4);
      --transition: 0.3s ease;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Poppins, sans-serif;
      background: #f4f6fb;
      display: flex;
      justify-content: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
      max-width: 1080px;
      width: 100%;
    }

    figure {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 0;
      cursor: pointer;
      transition: transform var(--transition);
    }

    figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition);
    }

    figure::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      transition: opacity var(--transition);
    }

    figure:hover img {
      transform: scale(1.1);
    }

    figure:hover::after {
      opacity: 1;
    }

    figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* Make it responsive below 700px */
    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: 1fr; /* Single column on mobile */
      }
    }
  </style>
</head>
<body>
  <main class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Image 1">
      <figcaption>Image 1</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1016/400/300" alt="Image 2">
      <figcaption>Image 2</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1018/400/300" alt="Image 3">
      <figcaption>Image 3</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1019/400/300" alt="Image 4">
      <figcaption>Image 4</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1020/400/300" alt="Image 5">
      <figcaption>Image 5</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1021/400/300" alt="Image 6">
      <figcaption>Image 6</figcaption>
    </figure>
  </main>
</body>
</html>
