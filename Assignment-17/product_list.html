<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q1 - Product List Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #productInput {
      padding: 6px;
      width: 220px;
    }

    #addProductBtn {
      padding: 6px 12px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
      max-width: 400px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
    }

    .product-name {
      flex: 1;
      margin-right: 10px;
    }

    button {
      margin-left: 5px;
      cursor: pointer;
    }

    .edit-input {
      width: 100%;
      padding: 4px;
    }
  </style>
</head>
<body>
  <h1>Product List Manager</h1>

  <input type="text" id="productInput" placeholder="Enter product name" />
  <button id="addProductBtn">Add Product</button>

  <ul id="productList">
    <!-- Products will appear here -->
  </ul>

  <script src="product_list.js"></script>
</body>
</html>
