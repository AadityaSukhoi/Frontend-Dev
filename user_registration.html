<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <h1>USER REGISTRATION</h1>
    <h4>Fields marked as <span style="color:red">*</span> are required.</h4>

    <form method="POST">
        <table cellpadding="8" cellspacing="0">
            <tr>
                <td><label for="email">Email<span style="color:red">*</span></label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>

            <tr>
                <td><label for="password">Password<span style="color:red">*</span></label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>

            <tr>
                <td><label for="retype_password">Retype Password<span style="color:red">*</span></label></td>
                <td><input type="password" id="retype_password" name="retype_password" required></td>
            </tr>

            <tr>
                <td><label for="first_name">First Name<span style="color:red">*</span></label></td>
                <td><input type="text" id="first_name" name="first_name" required></td>
            </tr>

            <tr>
                <td><label for="last_name">Last Name<span style="color:red">*</span></label></td>
                <td><input type="text" id="last_name" name="last_name" required></td>
            </tr>

            <tr>
                <td><label for="phone">Phone Number<span style="color:red">*</span></label></td>
                <td><input type="number" id="phone" name="phone" required></td>
            </tr>

            <tr>
                <td><label for="address">Address<span style="color:red">*</span></label></td>
                <td><input type="text" id="address" name="address" required></td>
            </tr>

            <tr>
                <td><label for="town">Town</label></td>
                <td><input type="text" id="town" name="town" required></td>
            </tr>

            <tr>
                <td><label for="region">Region<span style="color:red">*</span></label></td>
                <td><input type="text" id="region" name="region" required></td>
            </tr>

            <tr>
                <td><label for="postcode">Postcode/Zip<span style="color:red">*</span></label></td>
                <td><input type="number" id="postcode" name="postcode" required></td>
            </tr>

            <tr>
                <td><label for="country">Country<span style="color:red">*</span></label></td>
                <td>
                    <select id="country" name="country" required>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Register">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
