<!-- Create two HTML files:
● form.html → Contains a form with a text input and a submit button.
● result.html → Displays a message “Form successfully submitted.”
Use an <iframe> in form.html to load result.html after clicking Submit. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Iframe</title>
</head>
<body>
    <h1>Submit Your Info</h1>
    
    <form action="17_result.html" method="get" target="resultFrame">
        <label for="username">Enter your name:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        <input type="submit" value="Submit">
    </form>

    <h2>Result:</h2>
    <iframe name="resultFrame" width="400" height="100" style="border:1px solid #000;"></iframe>
</body>
</html>
