<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi jQuery Widgets</title>

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script>
        var jq1 = jQuery.noConflict(true);
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        var jq2 = jQuery.noConflict(true);
    </script>


<style>
    body {
        font-family: "Segoe UI", sans-serif;
            background: #f6f7fa;
            padding: 40px;
        }
        
        header h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        #carousel {
            width: 350px;
            margin: 0 auto 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
            font-size: 1.4rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        
        #widgets {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .widget {
            padding: 20px;
            width: 150px;
            background: white;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        
        .active {
            background: #cfe0ff;
            border: 2px solid #4a7dff;
        }
        
        #notificationModal {
            display: none;
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            width: 300px;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        #closeModal {
            margin-top: 15px;
            padding: 8px 15px;
            border: none;
            background: #4a7dff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .tooltipBox {
            position: absolute;
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: none;
        }
    </style>
</head>

<body>
    
    <header>
    <h1>Dashboard – Multi jQuery Widgets</h1>
</header>

<section id="carousel"></section>

<section id="widgets">
    <div class="widget" data-tip="Controls analytics">Analytics</div>
    <div class="widget" data-tip="User activity panel">Users</div>
    <div class="widget" data-tip="Performance metrics">Reports</div>
</section>

<div id="notificationModal">
    <h2>New Notification</h2>
    <p>You have new alerts on your dashboard.</p>
    <button id="closeModal">Close</button>
</div>

<div id="tooltip" class="tooltipBox"></div>

</body>
<script src="multiJquery.js" defer></script>
</html>
