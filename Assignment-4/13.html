<!-- Create a webpage that includes text written in three languages (English, Hindi, and French).
Add <meta charset="UTF-8"> inside <head> to ensure proper rendering of all characters. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Text Example</title>
</head>
<body>
    <h1>Multilingual Text Demo</h1>
    <p>
        English: Welcome to my website!<br>
        Hindi: मेरी वेबसाइट पर आपका स्वागत है!<br>
        French: Bienvenue sur mon site web !
    </p>
</body>
</html>
