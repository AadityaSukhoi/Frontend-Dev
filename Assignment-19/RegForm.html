<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Validation</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6fa;
            padding: 40px;
        }

        header h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #formContainer {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        
        label {
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 1rem;
            transition: 0.25s;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a7dff;
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #325fe0;
        }
        
        #successMsg {
            text-align: center;
            margin-top: 20px;
            font-weight: 700;
            color: green;
            display: none;
        }
        
        .error {
            border-color: red !important;
        }
        </style>
</head>

<body>

    <header>
    <h1>User Registration</h1>
</header>

<main>
    <section id="formContainer">
        <label>Name</label>
        <input type="text" id="name">

        <label>Email</label>
        <input type="text" id="email">
        
        <label>Password</label>
        <input type="password" id="password">
        
        <button id="registerBtn">Register</button>
    </section>
    
    <p id="successMsg">Registration Successful!</p>
</main>

</body>
<script src="RegForm.js" defer></script>
</html>
