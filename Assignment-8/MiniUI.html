<!-- Design a Complete Mini User Interface Layout
Requirements:
● Build a compact webpage containing a header, a main content
card, and a footer.
● Inside the main card, include a form, buttons, and a small image.
● Apply consistent box-sizing, shadows, and border styles.
● Add hover and focus effects using pseudo-classes.
● Use Flexbox for layout alignment and ensure full responsiveness. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface Layout</title>
<link rel="stylesheet" href="style6.css">
</head>
<body>
  <header>
    <h1>Mini User Interface Layout</h1>
  </header>

  <main>
    <div class="card">
      <img src="https://picsum.photos/100" alt="User Image">
      <form>
        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter your email">
        <div class="btn-group">
          <button type="submit" class="btn-primary">Submit</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
