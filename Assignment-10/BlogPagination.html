<!-- 9. Blog Pagination & Pager
Scenario:
Add pagination navigation to a blog posts page.
Requirements:
● Create a Bootstrap .pagination component with “Previous”, “1”, “2”, “Next”.
● Center it using .justify-content-center.
● Add a simple pager below with “Older Posts” and “Newer Posts” buttons
(.btn-outline-secondary).
● Use .container for alignment and spacing.

Goal: Use pagination elements for content navigation in multi-page layouts. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="fw-bold text-center mb-4">Blog Posts</h2>

        <nav>
            <ul class="pagination justify-content-center">
                
                <li class="page-item">
                    <a class="page-link" href="#">Previous</a>
                </li>

                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>

            </ul>
        </nav>

        <div class="d-flex justify-content-between mt-5">
            <a class="btn btn-outline-secondary" href="#">← Older Posts</a>
            <a class="btn btn-outline-secondary" href="#">Newer Posts →</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
