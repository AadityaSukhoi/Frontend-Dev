<!-- Q3. Responsive Cards with Media Queries
Goal:
Use media queries to make a card layout responsive at different
breakpoints.
Requirements:
● Create four cards arranged in a row using Flexbox.
● Layout changes as follows:
○ Desktop: 4 columns
○ Tablet (max-width 900 px): 2 columns

○ Mobile (max-width 600 px): 1 column
● Each card changes background color on hover.
● Add equal spacing and padding between cards. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cards with Media Queries</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <h1 class="title">Responsive Card Layout</h1>

    <div class="card-container">
        <div class="card">
            <h2>Card One</h2>
        </div>
        <div class="card">
            <h2>Card Two</h2>
        </div>
        <div class="card">
            <h2>Card Three</h2>
        </div>
        <div class="card">
            <h2>Card Four</h2>
        </div>
    </div>
</body>
</html>
