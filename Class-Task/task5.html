<!-- Task 5 Styled Button Collection
Create buttons: primary, secondary, outline, disabled.
Use padding, border-radius, shadows.
Hover + active + focus + disabled states with transitions.
Align via Flexbox. -->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Styled Button Collection</title>
<style>

  :root{
    --radius: 10px;
    --pad-y: 10px;
    --pad-x: 18px;
    --gap: 12px;

    --color-primary: #0b79ff;      /* vivid blue */
    --color-primary-600: #0967d2;
    --color-primary-700: #064ea2;

    --color-secondary: #2a2a2a;    /* dark neutral */
    --color-secondary-600: #141414;

    --color-outline-border: rgba(11,121,255,0.15);
    --color-white: #ffffff;
    --shadow-sm: 0 2px 6px rgba(13, 30, 60, 0.12);
    --shadow-lg: 0 10px 30px rgba(13, 30, 60, 0.18);

    --transition-fast: 180ms cubic-bezier(.2,.9,.3,1);
    --transition-slow: 260ms cubic-bezier(.2,.9,.3,1);
  }


  *{box-sizing:border-box}
  html,body{
    height:100%;
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background: linear-gradient(180deg, #f7fbff 0%, #ffffff 100%);
    color: #111827;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }

  .btn-collection {
    display:flex;
    flex-wrap:wrap;
    gap:var(--gap);
    align-items:center;
    justify-content:center;
    padding:18px;
    border-radius:14px;
    box-shadow: var(--shadow-sm);
    background: rgba(255,255,255,0.9);
  }

  .btn {
    appearance:none;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
    text-decoration:none;
    line-height:1;
    font-weight:600;
    font-size:15px;
    padding: var(--pad-y) var(--pad-x);
    border-radius: var(--radius);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast), color var(--transition-fast), opacity var(--transition-fast);
    box-shadow: var(--shadow-sm);
    will-change: transform, box-shadow;
    min-height:44px;
    min-width:fit-content;
  }

  /* Make buttons keyboard-focus visible and accessible */
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 6px 24px rgba(11,121,255,0.12), 0 0 0 4px rgba(11,121,255,0.12);
    transform: translateY(-1px);
  }

  /* ===========================
     Primary
     =========================== */
  .btn--primary {
    background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-600) 100%);
    color: var(--color-white);
  }
  .btn--primary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    background: linear-gradient(180deg, var(--color-primary-600), var(--color-primary-700));
  }
  .btn--primary:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(11,121,255,0.12);
  }

  /* ===========================
     Secondary (solid neutral)
     =========================== */
  .btn--secondary {
    background: linear-gradient(180deg, var(--color-secondary) 0%, var(--color-secondary-600) 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(10,10,10,0.12);
  }
  .btn--secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(10,10,10,0.16);
    background: linear-gradient(180deg, #1f1f1f, #0f0f0f);
  }
  .btn--secondary:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(10,10,10,0.10);
  }

  /* ===========================
     Outline (transparent with border)
     =========================== */
  .btn--outline {
    background: transparent;
    color: var(--color-primary-700);
    border: 1.5px solid var(--color-outline-border);
    box-shadow: none;
    font-weight:700;
  }
  .btn--outline:hover {
    background: rgba(11,121,255,0.06);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(11,121,255,0.06);
  }
  .btn--outline:active {
    background: rgba(11,121,255,0.09);
    transform: translateY(0);
  }

  /* ===========================
     Disabled
     =========================== */
  .btn:disabled,
  .btn[aria-disabled="true"]{
    pointer-events: none; 
    cursor: not-allowed;
    opacity: 0.56;
    transform: none !important;
    box-shadow: none;
    filter: grayscale(0.02);
    transition: opacity var(--transition-fast) linear;
  }

  .btn--outline:disabled {
    border-color: rgba(11,121,255,0.06);
    color: rgba(3,3,3,0.5);
  }

  .btn .icon {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    font-size:12px;
    border-radius:6px;
    opacity:0.95;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }

  @media (max-width:480px) {
    .btn-collection { gap:10px; padding:12px; }
    .btn { font-size:14px; padding:8px 12px; min-width:120px; }
  }
</style>
</head>
<body>

  <div class="btn-collection" role="group" aria-label="Demo button collection">
    <button class="btn btn--primary" type="button" aria-pressed="false">
      <span class="icon" aria-hidden="true">🚀</span>
      Primary
    </button>

    <button class="btn btn--secondary" type="button">
      Secondary
    </button>

    <button class="btn btn--outline" type="button">
      Outline
    </button>

    <button class="btn btn--primary" type="button" disabled aria-disabled="true" title="Disabled">
      Disabled
    </button>
  </div>

</body>
</html>
