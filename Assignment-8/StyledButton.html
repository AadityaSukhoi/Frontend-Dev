<!-- Design a Styled Button Collection
Requirements:
● Create multiple button styles (primary, secondary, outline, and
disabled).
● Use padding, border-radius, and shadows for attractive design.
● Apply hover and active effects using transitions.
● Demonstrate :focus and :disabled pseudo-classes clearly.
● Align buttons using Flexbox and ensure consistent spacing. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Button Collection</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .button-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
  }

  button {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  /* Primary Button */
  .btn-primary {
    background: #2563eb;
    color: white;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }
  .btn-primary:active {
    transform: scale(0.97);
  }
  .btn-primary:focus {
    outline: 3px solid rgba(37,99,235,0.4);
    outline-offset: 2px;
  }

  /* Secondary Button */
  .btn-secondary {
    background: #10b981;
    color: white;
  }
  .btn-secondary:hover {
    background: #059669;
  }
  .btn-secondary:active {
    transform: scale(0.97);
  }
  .btn-secondary:focus {
    outline: 3px solid rgba(16,185,129,0.4);
    outline-offset: 2px;
  }

  /* Outline Button */
  .btn-outline {
    background: transparent;
    color: #1e3a8a;
    border: 2px solid #1e3a8a;
  }
  .btn-outline:hover {
    background: #1e3a8a;
    color: white;
  }
  .btn-outline:active {
    transform: scale(0.97);
  }
  .btn-outline:focus {
    outline: 3px solid rgba(30,58,138,0.3);
    outline-offset: 2px;
  }

  /* Disabled Button */
  button:disabled,
  .btn-disabled {
    background: #cbd5e1;
    color: #64748b;
    border: none;
    cursor: not-allowed;
    box-shadow: none;
  }
  button:disabled:hover {
    transform: none;
  }

  @media (max-width: 600px) {
    .button-container {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
</head>
<body>
  <div class="button-container">
    <button class="btn-primary">Primary Button</button>
    <button class="btn-secondary">Secondary Button</button>
    <button class="btn-outline">Outline Button</button>
    <button class="btn-disabled" disabled>Disabled Button</button>
  </div>
</body>
</html>
