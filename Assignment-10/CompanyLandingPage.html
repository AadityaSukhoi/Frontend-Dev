<!-- 1. Company Landing Page (Intro to Bootstrap)
Scenario:
You’ve been hired to make a startup’s landing page using Bootstrap.
Requirements:
● Include Bootstrap via CDN and verify setup.
● Create a full-width header with the company name and a navbar.
● Add a hero section with a large heading, subtitle, and “Get Started” button.
● Use .container, .row, and .col for layout.
● The page must resize perfectly across screen sizes.

Goal: Demonstrate how Bootstrap’s core grid and utilities make layout simple. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Landing Page</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Header + Navbar -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand fw-bold" href="#">StartupX</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-5 bg-light text-center">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-md-8 mx-auto">
                    <h1 class="display-4 fw-bold">Build Something Amazing</h1>
                    <p class="lead mb-4">
                        Bootstrap helps you create clean, responsive layouts faster than you can say “media query”.
                    </p>
                    <a href="#" class="btn btn-primary btn-lg">Get Started</a>
                </div>

            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
