<!-- Create a page that includes all important <head> elements:
● <title>
● <meta> (charset, description, author)
● <base> (to set base URL)
● <link> (to favicon or other resource)
● <style> (can be empty)
● <script> (can be empty)
Add comments explaining what each tag is used for. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for the page -->
    <meta charset="UTF-8">

    <!-- Page description for search engines -->
    <meta name="description" content="This is an example page demonstrating all important head elements.">

    <!-- Author of the page -->
    <meta name="author" content="AadityaSukhoi">

    <!-- Title of the page, shown in browser tab -->
    <title>Complete Head Example</title>

    <!-- Base URL for relative links -->
    <base href="https://www.example.com/">

    <!-- Link to a favicon (small icon in browser tab) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Internal CSS styles (currently empty) -->
    <style>
        /* Add custom CSS here */
    </style>

    <!-- Internal JavaScript (currently empty) -->
    <script>
        // Add custom JavaScript here
    </script>
</head>
<body>
    <h1>Welcome to the Complete Head Example Page</h1>
    <p>This page demonstrates all important head elements with comments explaining their purpose.</p>
</body>
</html>
