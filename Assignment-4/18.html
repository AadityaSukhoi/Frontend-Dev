<!-- Write a paragraph that includes both long and short quotations:
● Use <blockquote> for a long quote.
● Use <q> for a short quote inside another paragraph.
Also include one HTML entity in the quote (e.g., &amp;, &lt;). -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations Example</title>
</head>
<body>
    <h1>Quotations Demo</h1>

    <blockquote>
        "The only limit to our realization of tomorrow is our doubts of today. 
        Let us move forward with strong &amp; courageous hearts."
    </blockquote>

    <p>
        As the famous saying goes, <q>Knowledge is power</q>, we should always keep learning.
    </p>
</body>
</html>
