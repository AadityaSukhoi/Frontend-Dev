<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Step Goal Tracker</title>
  <link rel="stylesheet" href="stepcalc.css" />
</head>
<body>
  <div class="card">
    <h1>Step Goal Tracker</h1>

    <div class="controls">
      <label for="steps">Enter steps</label>
      <input id="steps" type="number" placeholder="e.g. 7200" min="0" />
      <button id="goBtn">Update</button>
    </div>

    <div class="status-row">
      <div class="circle-wrap" aria-hidden="true">
        <svg class="progress-ring" width="140" height="140">
          <circle class="ring-bg" cx="70" cy="70" r="60" />
          <circle class="ring" cx="70" cy="70" r="60" />
        </svg>
        <div class="center-text">
          <div id="stepsDisplay">0</div>
          <div class="small">steps</div>
        </div>
      </div>

      <div class="message">
        <div id="messageText">Keep Going</div>
        <div id="percentText">0%</div>
      </div>
    </div>

    <p class="hint">Goal: <strong id="goalLabel">10,000</strong> steps</p>
  </div>

  <script src="stepcalc.js"></script>
</body>
</html>
