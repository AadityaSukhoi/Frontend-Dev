<!-- 3. Product Catalog (Bootstrap Grid System)
Scenario:
Build a grid-based product listing for an online store.
Requirements:
● Use .row and .col-md-3 to create a 4-column product grid.
● Each product card includes an image, name, price, and “Add to Cart” button.
● On tablets, show 2 columns; on mobiles, 1 column.

● Add hover effects using .shadow-sm and transitions.

Goal: Use Bootstrap’s grid and responsive classes to build an adaptive product layout. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap CDN -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <style>
        .product-card {
            transition: 0.3s ease; /* smooth hover */
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.75rem 1.25rem rgba(0,0,0,0.15);
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center fw-bold mb-4">Our Products</h2>

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm">
                    <img src="https://picsum.photos/300/200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title">Product Name 1</h5>
                        <p class="card-text fw-bold">$19.99</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm">
                    <img src="https://picsum.photos/300/200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title">Product Name 2</h5>
                        <p class="card-text fw-bold">$24.99</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm">
                    <img src="https://picsum.photos/300/200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title">Product Name 3</h5>
                        <p class="card-text fw-bold">$29.99</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card product-card shadow-sm">
                    <img src="https://picsum.photos/300/200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title">Product Name 4</h5>
                        <p class="card-text fw-bold">$34.99</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
