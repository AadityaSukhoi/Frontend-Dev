<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Student Result App</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; background:#f7f7f8; color:#222; }
      .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
      .title { font-size:24px; font-weight:700; }
      .container { max-width:900px; margin:0 auto; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
      button { padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
      .primary { background:#1f6feb; color:white; border-color:#1f6feb; }
      .danger { background:#ff6b6b; color:white; border-color:#ff6b6b; }
      .actions { display:flex; gap:8px; }
      table { width:100%; border-collapse:collapse; margin-top:12px; }
      th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; }
      .form-row { display:flex; gap:10px; margin-bottom:10px; }
      .form-row input { flex:1; padding:8px; border-radius:6px; border:1px solid #ccc; }
      .center { text-align:center; margin-top:20px; color:#666; }
      .small { font-size:13px; color:#666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/index.js"></script>
  </body>
</html>
