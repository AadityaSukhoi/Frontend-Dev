<!-- Create an HTML file that embeds a YouTube video using an <iframe>.
Set the width and height using only percentage values (not pixels) to make it adjust when
resizing the browser. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Embed</title>
</head>
<body>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XHy83r5TYas?si=FSYtc1RmNjEW-eDX"></iframe>
</body>
</html>
