<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph</title>
</head>
<body>
    <!-- Write a paragraph containing:
● A highlighted word using <mark>
● A small note at the end using <small> (e.g., “Updated recently”). -->
    <p>This is a <mark>highlighted</mark> word in a paragraph. <small>Updated recently</small></p>
</body>
</html>
