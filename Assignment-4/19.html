<!-- Create a web page demonstrating HTML form security attributes:
● Add autocomplete="off" to the form.
● Use required on all input fields.
Below the form, write a note explaining why turning off autocomplete can improve
security. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Security Example</title>
</head>
<body>
    <h1>Secure Form Demo</h1>

    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <p>
        <strong>Note:</strong> Turning off <code>autocomplete</code> prevents browsers from
        automatically filling in sensitive information like passwords or credit card numbers.
        This reduces the risk of unauthorized access if someone else uses your device or if the
        device is compromised.
    </p>
</body>
</html>
