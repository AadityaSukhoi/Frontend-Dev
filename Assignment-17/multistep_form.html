<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 - Multi-Step Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .step {
      display: none;
      margin-bottom: 10px;
    }

    .step.active {
      display: block;
    }

    .buttons {
      margin-top: 10px;
    }

    .buttons button {
      margin-right: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }

    #summary {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    .error {
      color: red;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Multi-Step Form</h1>

  <div id="formSteps">
    <div class="step active" data-step="1">
      <label>
        Name:
        <input type="text" id="nameInput" />
      </label>
      <div id="nameError" class="error"></div>
      <div class="buttons">
        <button id="next1">Next</button>
      </div>
    </div>

    <div class="step" data-step="2">
      <label>
        Email:
        <input type="email" id="emailInput" />
      </label>
      <div id="emailError" class="error"></div>
      <div class="buttons">
        <button id="back2">Back</button>
        <button id="next2">Next</button>
      </div>
    </div>

    <div class="step" data-step="3">
      <label>
        Password:
        <input type="password" id="passwordInput" />
      </label>
      <div id="passwordError" class="error"></div>
      <div class="buttons">
        <button id="back3">Back</button>
        <button id="finish">Finish</button>
      </div>
    </div>
  </div>

  <div id="summary"></div>

  <script src="multistep_form.js"></script>
</body>
</html>
