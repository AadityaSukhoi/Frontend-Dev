<!-- Create a Combined Effects Demonstration Page
Requirements:
● Combine pseudo-classes, transitions, and transformations on the
same elements.
● For example, make buttons grow slightly and change color on
hover.
● Add subtle box-shadow to enhance the effect.
● Use Flexbox to distribute multiple examples evenly across the
page.
● Ensure transitions are smooth and visually balanced. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Effects Demonstration</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: linear-gradient(135deg, #f8fafc, #e0f2fe);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    flex-wrap: wrap;
    padding: 2rem;
  }

  .btn {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease-in-out;
    transform: scale(1);
  }

  .btn-primary {
    background: #2563eb;
  }
  .btn-primary:hover {
    background: #1d4ed8;
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
  }
  .btn-primary:active {
    transform: scale(0.95);
  }

  .btn-success {
    background: #10b981;
  }
  .btn-success:hover {
    background: #059669;
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(16, 185, 129, 0.3);
  }
  .btn-success:active {
    transform: scale(0.95);
  }

  .btn-warning {
    background: #f59e0b;
  }
  .btn-warning:hover {
    background: #d97706;
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(245, 158, 11, 0.3);
  }
  .btn-warning:active {
    transform: scale(0.95);
  }

  .btn-danger {
    background: #ef4444;
  }
  .btn-danger:hover {
    background: #dc2626;
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(239, 68, 68, 0.3);
  }
  .btn-danger:active {
    transform: scale(0.95);
  }

  .btn:focus {
    outline: 3px solid rgba(0, 0, 0, 0.1);
    outline-offset: 3px;
  }

  @media (max-width: 600px) {
    .container {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-danger">Danger</button>
  </div>
</body>
</html>
